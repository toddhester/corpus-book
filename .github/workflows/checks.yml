# PR checks: CLA assent, provenance form, path scope, hygiene.
# Plain names, terse output, no auto-merge, no judgment calls.

name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assent present
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: python {0}
        run: |
          import os, re, sys
          body = (os.environ.get("BODY") or "").replace("\r\n", "\n").replace("\r", "\n")
          # Tolerant on purpose: any bullet or none, any spacing, [x] or [ X ], any case.
          ok = re.search(r"^[ \t>*_-]*\[[ \t]*[xX][ \t]*\][ \t]*\**[ \t]*i[ \t]+agree[ \t]+to[ \t]+the[ \t]+corpus[ \t]+cla",
                         body, re.I | re.M)
          if not ok:
              sys.exit("CLA checkbox not checked. Tick the box in the PR description. See CLA.md.")
          print("license: ok")

  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Provenance block well-formed
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: python {0}
        run: |
          import os, re, sys

          body = (os.environ.get("BODY") or "").replace("\r\n", "\n").replace("\r", "\n")

          # The fence is a convenience, not the contract. Prefer a fenced block if one is
          # present (any fence char, any count, any case, any surrounding whitespace);
          # otherwise read the fields from the body at large. What matters is the fields.
          m = re.search(r"^[ \t]*(?:`{3,}|~{3,})[ \t]*provenance[ \t]*$(.*?)^[ \t]*(?:`{3,}|~{3,})[ \t]*$",
                        body, re.S | re.I | re.M)
          block = m.group(1) if m else body

          fields = {}
          for line in block.splitlines():
              line = line.split("#", 1)[0]              # drop template comments
              line = line.strip().strip("*_`> \t")      # drop markdown emphasis / quoting
              if ":" not in line:
                  continue
              k, v = line.split(":", 1)
              k = k.strip().strip("*_`> \t").lower().replace("_", "-")
              fields[k] = v.strip().strip("*_`> \t")

          def f(k):
              return fields.get(k, "").strip()

          KNOWN = {"written-by", "model", "model-version", "model-id-source", "prompt-author",
                   "prompting-human", "date", "agent-key", "signature", "attestation"}
          errors = []

          wb = f("written-by").lower()
          if wb not in ("human", "model", "pair"):
              errors.append("written-by must be one of: human | model | pair")
          if not f("prompting-human"):
              errors.append("prompting-human is required")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", f("date")):
              errors.append("date must be YYYY-MM-DD")
          # prompt-author: who wrote the prompt/brief (human or model). Required always.
          if f("prompt-author").lower() not in ("human", "model"):
              errors.append("prompt-author must be one of: human | model")
          if wb in ("model", "pair"):
              for k in ("model", "model-version"):
                  if f(k).lower() in ("", "n/a", "na", "none", "-"):
                      errors.append("%s is required when written-by is %s" % (k, wb))
              # Models cannot reliably name themselves — the id must come from the
              # call, never from the model's own text.
              if f("model-id-source").lower() not in ("api-call", "human-record"):
                  errors.append(
                      "model-id-source must be api-call or human-record when "
                      "written-by is %s (never the model's self-report)" % wb)

          if errors:
              seen = {k: v for k, v in fields.items() if k in KNOWN}
              print("What this check parsed from your PR description:")
              if seen:
                  for k in sorted(seen):
                      print("  %-18s %s" % (k + ":", seen[k] or "(empty)"))
              else:
                  print("  (no provenance fields found at all)")
              print("")
              print("Spacing, indentation, line endings and markdown emphasis do not matter.")
              print("Field names and values do. See the PR template.")
              print("")
              sys.exit("Provenance block invalid:\n- " + "\n- ".join(errors))

          print("provenance: ok (form only; truthfulness is reviewed by a human)")

  paths:
    runs-on: ubuntu-latest
    # Owner PRs are exempt. Trusted draft-bot accounts (corpus-draft-*) may also write to
    # corpus/; only genuinely external contributors are held to apocrypha/.
    if: >-
      github.event.pull_request.user.login != github.repository_owner &&
      !startsWith(github.event.pull_request.user.login, 'corpus-draft-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: External PRs touch apocrypha only
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Three-dot: compare against the MERGE BASE, so commits landed on the base branch
          # since this PR forked are not attributed to the PR.
          bad=$(git diff --name-only "$base...$head" | grep -vE '^apocrypha/' || true)
          if [ -n "$bad" ]; then
            echo "External PRs may only touch apocrypha/. Out of bounds:"; echo "$bad"; exit 1
          fi

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Markdown only, size caps, no invisible unicode
        shell: python {0}
        run: |
          import subprocess, sys, os, unicodedata
          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          out = subprocess.check_output(
              # Three-dot: diff against the MERGE BASE, not the base tip — otherwise every
              # commit landed on the base branch since the fork shows up as the PR's doing.
              ["git", "diff", "--name-only", "--diff-filter=ACMR", base + "..." + head], text=True)
          files = [f for f in out.splitlines() if f]
          errors = []
          # Chars that hide content: zero-width, bidi controls, BOM, etc.
          banned = set(range(0x200B, 0x2010)) | set(range(0x202A, 0x202F)) \
                 | set(range(0x2060, 0x2070)) | {0xFEFF, 0x00AD, 0x180E}
          for f in files:
              if not f.endswith((".md", ".txt")):
                  errors.append(f"{f}: only .md/.txt files are accepted"); continue
              if os.path.getsize(f) > 200_000:
                  errors.append(f"{f}: exceeds 200KB"); continue
              try:
                  text = open(f, encoding="utf-8").read()
              except UnicodeDecodeError:
                  errors.append(f"{f}: not valid UTF-8"); continue
              for ch in set(text):
                  o = ord(ch)
                  if o in banned or (unicodedata.category(ch) == "Cf" and ch != "\n"):
                      errors.append(f"{f}: contains invisible character U+{o:04X}"); break
          if errors:
              sys.exit("hygiene failures:\n- " + "\n- ".join(errors))
          print(f"hygiene: ok ({len(files)} files)")
